version: '3.8'

services:
  extraccion-api:
    build:
      context: .
      dockerfile: services/extraccion/Dockerfile

    image: extraccion-ne:latest
    container_name: extraccion-instancia

    # Forzamos aislamiento Hyper-V
    isolation: hyperv

    ports:
      - "8000:8000"

    environment:
      # Claves de Gemini separadas por coma
      - GEMINI_API_KEYS=${GEMINI_API_KEYS}

      # Directorio de salida
      - OUTPUT_BASE_DIR=C:/app/output

      # Sin estas dos, get_client() devuelve None y NINGUNA extracción se persiste
      # (services/extraccion/supabase_client.py:77-85). Bug vivo hoy en Docker.
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}

      # Opcional
      - PYTHONDONTWRITEBYTECODE=1

    volumes:
      # Mismo mount path en ambos servicios: csv_disk_path se guarda ABSOLUTO.
      - extraccion-output:C:/app/output

    restart: always

  presupuestacion-api:
    build:
      context: .
      dockerfile: services/presupuestacion/Dockerfile

    image: presupuestacion-ne:latest
    container_name: presupuestacion-instancia

    # Forzamos aislamiento Hyper-V
    isolation: hyperv

    ports:
      - "8001:8001"

    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}

      # Exportación de OC a Progress (oc-export-progress D8): los CSV se escriben en
      # <PROGRESS_DOCS_DIR>/oc, es decir C:\SACPro\documentos_ia\oc en el host.
      - PROGRESS_DOCS_DIR=C:/app/documentos_ia
      - OC_EXPORT_ENCODING=cp1252

      # Opcional
      - PYTHONDONTWRITEBYTECODE=1

    volumes:
      # Read-only: presupuestacion NUNCA escribe en el output del extractor (D2).
      - extraccion-output:C:/app/output:ro
      # Escritura: carpeta de intercambio con Progress. C:\SACPro\documentos_ia debe existir
      # en el host antes de `docker compose up` (los contenedores Windows no la crean).
      - C:/SACPro/documentos_ia:C:/app/documentos_ia

    restart: always

volumes:
  extraccion-output:
