version: '3.8'

services:
  extraccion-api:
    build:
      context: .
      dockerfile: services/extraccion/Dockerfile

    image: extraccion-ne:latest
    container_name: extraccion-instancia

    # Forzamos aislamiento Hyper-V
    isolation: hyperv

    ports:
      - "8000:8000"

    environment:
      # Claves de Gemini separadas por coma
      - GEMINI_API_KEYS=${GEMINI_API_KEYS}

      # Directorio de salida
      - OUTPUT_BASE_DIR=C:/app/output

      # Opcional
      - PYTHONDONTWRITEBYTECODE=1

    restart: always

  presupuestacion-api:
    build:
      context: .
      dockerfile: services/presupuestacion/Dockerfile

    image: presupuestacion-ne:latest
    container_name: presupuestacion-instancia

    # Forzamos aislamiento Hyper-V
    isolation: hyperv

    ports:
      - "8001:8001"

    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}

      # Opcional
      - PYTHONDONTWRITEBYTECODE=1

    restart: always
