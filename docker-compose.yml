version: '3.8'

services:
  extractor-api:
    build:
      context: .
      dockerfile: Dockerfile

    image: extractor-ne:latest
    container_name: extractor-instancia

    # Forzamos aislamiento Hyper-V
    isolation: hyperv

    ports:
      - "8000:8000"

    environment:
      # Claves de Gemini separadas por coma
      - GEMINI_API_KEYS=${GEMINI_API_KEYS}

      # Directorio de salida
      - OUTPUT_BASE_DIR=C:/app/output

      # Opcional
      - PYTHONDONTWRITEBYTECODE=1

    restart: always