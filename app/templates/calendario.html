<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calendario — Droguería Nueva Era</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/fonts/manrope.css">
    <link rel="stylesheet" href="/static/styles.css?v=2026-06-13e">
</head>
<body class="historial-body">

    <div class="historial-wrapper">

        <!-- Header -->
        <header class="historial-header">
            <a href="/" class="historial-back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 5l-7 7 7 7"/>
                </svg>
                Volver
            </a>
            <div class="historial-title-group">
                <h1 class="historial-title">Calendario de Comparativas</h1>
                <p class="historial-subtitle">Seguimiento del estado de comparativas por licitación</p>
            </div>
        </header>

        <!-- Filtros por estado de comparativa -->
        <div class="historial-controls">
            <div class="filter-tabs" role="tablist">
                <button class="filter-tab active" data-comp="" role="tab">Todas</button>
                <button class="filter-tab" data-comp="sin_comparativa" role="tab">Sin comparativa</button>
                <button class="filter-tab" data-comp="pedida" role="tab">Pedidas</button>
                <button class="filter-tab" data-comp="cargada" role="tab">Cargadas</button>
            </div>
            <div class="cal-year-nav">
                <button class="btn-year-nav" aria-label="Año anterior"
                        onclick="window.CalendarioModule.navegarAño(-1)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 18l-6-6 6-6"/>
                    </svg>
                </button>
                <span id="year-range-label" class="cal-year-label">—</span>
                <button class="btn-year-nav" aria-label="Año siguiente"
                        onclick="window.CalendarioModule.navegarAño(1)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 18l6-6-6-6"/>
                    </svg>
                </button>
            </div>
            <input
                class="historial-search"
                type="text"
                id="search-input"
                placeholder="Buscar por nombre de licitación…"
                autocomplete="off"
            >
        </div>

        <!-- Card principal -->
        <div class="historial-table-wrap">

            <div class="historial-state" id="loading-state">
                <div class="spinner"></div>
                Cargando calendario…
            </div>

            <div class="historial-state hidden" id="empty-state">
                <svg class="historial-state-icon" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.5">
                    <path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2z"/>
                </svg>
                No hay licitaciones que mostrar
            </div>

            <div id="cal-months" class="cal-months hidden"></div>

        </div>

    </div>

    <a href="/guia" target="_blank" rel="noopener" class="guide-fab" aria-label="Abrir guía de usuario">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
        Guía de usuario
    </a>

    <script src="/static/calendario.js?v=2026-06-13e"></script>
</body>
</html>
