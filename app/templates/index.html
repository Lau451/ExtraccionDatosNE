<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Extracción de datos</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

    <div class="card">
        <div class="header">
            <div class="logo" aria-label="Drogueria Nueva Era">
                <img src="/static/IMG/LOGO_NE.jpg" alt="Drogueria Nueva Era" class="logo-img">
                
            </div>
        </div>

        <h1>📄 Extracción de datos</h1>
        <p class="subtitle">
            Subí una cotización
        </p>

        <form id="upload-form">
            <input
                type="file"
                id="archivo"
                name="archivo"
                accept=".pdf,.jpg,.jpeg,.png,.xls,.xlsx"
                hidden
            >

            <label for="archivo" class="file-label drop-zone" id="file-label">
                <span class="drop-title">Seleccionar archivo</span>
                <span class="drop-hint">o arrastra y solta aqui</span>
            </label>

            <div class="file-preview hidden" id="file-preview">
                <div class="file-icon" id="file-icon"></div>
                <p class="filename" id="nombre-archivo"></p>
                <button type="button" class="btn btn-ghost" id="cancelar-btn">
                    Quitar archivo
                </button>
            </div>

            <button type="submit" class="btn" id="procesar-btn" disabled>
                Procesar archivo
            </button>

            <button type="button" class="btn hidden" id="nuevo-btn">
                Subir otro archivo
            </button>
        </form>
        <div class="progress hidden" id="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <p class="status" id="estado"></p>
    </div>

    <script src="/static/main.js"></script>
</body>
</html>
