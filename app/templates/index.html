<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Extractor de Documentos</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<div class="container">
    <h1>📄 Extracción de documentos</h1>

    <form action="/procesar" method="post" enctype="multipart/form-data">
        <input type="file" name="archivo" required>
        <button type="submit">Procesar</button>
    </form>

    {% if resultado %}
        <div class="resultado">
            <p>✅ Archivo generado:</p>
            <a href="{{ resultado }}" download>Descargar CSV</a>
        </div>
    {% endif %}
</div>

</body>
</html>
