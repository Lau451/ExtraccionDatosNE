<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Matching — Foco con comparación</title>
<style>
  :root {
    --navy: #0f172a; --accent: #0369a1;
    --slate-50: #f8fafc; --slate-100: #f1f5f9; --slate-200: #e2e8f0; --slate-300: #cbd5e1;
    --slate-400: #94a3b8; --slate-500: #64748b; --slate-600: #475569; --slate-700: #334155; --slate-900: #0f172a;
    --amber-50: #fffbeb; --amber-200: #fde68a; --amber-800: #92400e;
    --sky-50: #f0f9ff; --sky-200: #bae6fd; --sky-800: #075985;
    --emerald-50: #ecfdf5; --emerald-200: #a7f3d0; --emerald-700: #047857; --emerald-800: #065f46;
    --font-sans: "Fira Sans", ui-sans-serif, system-ui, sans-serif;
    --font-mono: "Fira Code", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-sans); color: var(--slate-900); background: var(--slate-50); display: flex; min-height: 100vh; }
  button, input { font: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  aside.nav { width: 256px; flex-shrink: 0; background: var(--navy); color: var(--slate-100); padding: 24px 12px; }
  aside.nav .brand { font-size: 18px; font-weight: 600; padding: 0 12px 24px; }
  aside.nav a { display: block; padding: 8px 12px; border-radius: 6px; font-size: 14px; color: var(--slate-200); text-decoration: none; }
  aside.nav a[aria-current] { background: rgb(3 105 161 / .2); color: #fff; }
  main { flex: 1; padding: 24px 40px 40px; display: flex; flex-direction: column; gap: 20px; }
  .top { display: flex; align-items: flex-end; gap: 24px; }
  h1 { font-size: 20px; line-height: 28px; font-weight: 600; margin: 0; }
  .meta { font-size: 14px; color: var(--slate-600); }
  .map { margin-left: auto; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  .map .cells { display: grid; grid-template-columns: repeat(14, 18px); gap: 4px; }
  .map .cell { width: 18px; height: 18px; border-radius: 4px; border: 0; padding: 0; }
  .map .cell[aria-current="true"] { outline: 2px solid var(--navy); outline-offset: 1px; }
  .c-pendiente { background: var(--amber-200); }
  .c-sugerido { background: var(--sky-200); }
  .c-automatico, .c-confirmado { background: var(--emerald-700); }
  .c-sin_match { background: var(--slate-400); }
  .map .legend { display: flex; gap: 12px; font-size: 12px; color: var(--slate-600); }
  .map .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  .stage { display: grid; grid-template-columns: 1fr 1.25fr; gap: 20px; align-items: start; }
  .card { background: #fff; border: 1px solid var(--slate-200); border-radius: 8px; box-shadow: 0 1px 3px 0 rgb(0 0 0/.1),0 1px 2px -1px rgb(0 0 0/.1); padding: 20px 24px; }
  .lbl { font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; color: var(--slate-500); }
  .pliego h2 { font-size: 24px; line-height: 32px; font-weight: 600; margin: 8px 0 16px; }
  .facts { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-size: 14px; }
  .facts dt { color: var(--slate-500); }
  .facts dd { margin: 0; font-variant-numeric: tabular-nums; }
  .nav-r { display: flex; gap: 8px; margin-top: 20px; }
  .btn { border-radius: 6px; padding: 8px 12px; font-size: 14px; font-weight: 500; }
  .btn-secondary { background: #fff; color: var(--slate-700); border: 1px solid var(--slate-300); }
  .btn-primary { background: var(--navy); color: #fff; border: 0; }
  .cands { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .cand { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: center; text-align: left; background: #fff; border: 1px solid var(--slate-200); border-radius: 8px; padding: 14px 16px; color: var(--slate-900); }
  .cand:hover { border-color: var(--accent); }
  .cand.best { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .cand.elegido { border-color: var(--emerald-700); background: var(--emerald-50); }
  .cand .name { font-size: 16px; font-weight: 500; }
  .cand .sub { font-size: 12px; color: var(--slate-500); font-family: var(--font-mono); }
  .cand .score { text-align: right; font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 600; color: var(--slate-700); }
  .cand .score small { display: block; font-size: 12px; font-weight: 400; color: var(--slate-500); }
  .cand .why { grid-column: 1 / -1; font-size: 12px; color: var(--slate-600); }
  mark { background: var(--sky-50); color: var(--sky-800); box-shadow: inset 0 -2px 0 var(--sky-200); padding: 0 2px; border-radius: 2px; }
  mark.miss { background: var(--amber-50); color: var(--amber-800); box-shadow: inset 0 -2px 0 var(--amber-200); }
  kbd { font-family: var(--font-mono); font-size: 12px; border: 1px solid var(--slate-300); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--slate-700); background: #fff; }
  .other { display: flex; gap: 8px; margin-top: 16px; }
  .other input { flex: 1; border: 1px solid var(--slate-300); border-radius: 6px; padding: 8px 12px; font-size: 14px; }
  .empty { font-size: 14px; color: var(--slate-500); padding: 16px 0; }
  .done { text-align: center; padding: 48px; font-size: 16px; color: var(--slate-700); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<aside class="nav" aria-label="Navegación principal">
  <div class="brand">Droguería Nueva Era</div>
  <a href="#">Carga de documentos</a>
  <a href="#">Validar extracción</a>
  <a href="#" aria-current="page">Matching de catálogo</a>
  <a href="#">Productos</a>
  <a href="#">Terceros</a>
</aside>
<main>
  <div class="top">
    <div>
      <h1>Matching de C17_ACEL16</h1>
      <div class="meta">Hospital Sayago · Licitación · <span id="prog"></span></div>
    </div>
    <nav class="map" aria-label="Mapa de renglones">
      <div class="cells" id="cells"></div>
      <div class="legend"><span><i class="c-pendiente"></i>Pendiente</span><span><i class="c-sugerido"></i>Sugerido</span><span><i class="c-confirmado"></i>Resuelto</span><span><i class="c-sin_match"></i>Sin match</span></div>
    </nav>
  </div>
  <div id="stage"></div>
</main>
<script>
const R = [
  { n: 1, d: 'AMOXICILINA 500 MG COMPRIMIDOS', q: 2400, e: 'sugerido', c: [['Amoxicilina 500 mg comp. x 1000', 'AMX500C', 84], ['Amoxicilina 875 mg comp. x 14', 'AMX875C', 61], ['Amoxicilina + ác. clavulánico 500/125 mg', 'AMC500', 52]] },
  { n: 2, d: 'CLORURO DE SODIO 0,9% SOL. FISIOLOGICA X 500 ML', q: 1200, e: 'automatico', p: 0, c: [['Solución fisiológica 0,9% 500 ml', 'SF500', 100]] },
  { n: 3, d: 'IBUPROFENO 400 MG COMPRIMIDOS', q: 3000, e: 'sugerido', c: [['Ibuprofeno 400 mg comp. x 500', 'IBU400', 78], ['Ibuprofeno 600 mg comp. x 500', 'IBU600', 64]] },
  { n: 4, d: 'GUANTES DE LATEX ESTERIL TALLE 7', q: 500, e: 'pendiente', c: [['Guante de examinación látex talle M', 'GLX-M', 41], ['Guante de nitrilo talle M', 'GNT-M', 38]] },
  { n: 5, d: 'JERINGA DESCARTABLE 5 ML C/AGUJA 21G', q: 10000, e: 'sugerido', c: [['Jeringa 5 ml con aguja 21G x 1 1/2', 'JER5-21', 66], ['Jeringa 10 ml con aguja 21G', 'JER10-21', 55]] },
  { n: 6, d: 'ENOXAPARINA 40 MG JERINGA PRELLENADA', q: 300, e: 'confirmado', p: 0, c: [['Enoxaparina 40 mg/0,4 ml jer. prellenada', 'ENX40', 88]] },
  { n: 7, d: 'OMEPRAZOL 20 MG CAPSULAS', q: 1800, e: 'sugerido', c: [['Omeprazol 20 mg cáps. x 500', 'OMP20', 91], ['Omeprazol 40 mg FA IV', 'OMP40IV', 47]] },
  { n: 8, d: 'CEFTRIAXONA 1 G FA IV', q: 450, e: 'sugerido', c: [['Ceftriaxona 1 g FA', 'CFX1G', 72], ['Cefalotina 1 g FA', 'CFL1G', 49]] },
  { n: 9, d: 'GASA ESTERIL 10X10 CM X 100 SOBRES', q: 200, e: 'pendiente', c: [] },
  { n: 10, d: 'PARACETAMOL 1 G/100 ML SOL. INYECTABLE', q: 600, e: 'sugerido', c: [['Paracetamol 1 g/100 ml sol. iny.', 'PCT1G-IV', 58], ['Paracetamol 500 mg comp. x 1000', 'PCT500', 44]] },
  { n: 11, d: 'METFORMINA 850 MG COMPRIMIDOS', q: 2000, e: 'automatico', p: 0, c: [['Metformina 850 mg comp. x 500', 'MTF850', 100]] },
  { n: 12, d: 'CATETER IV 20G', q: 900, e: 'sin_match', c: [['Catéter IV 22G', 'CAT22', 54]] },
  { n: 13, d: 'DEXAMETASONA 8 MG/2 ML AMPOLLA', q: 400, e: 'sugerido', c: [['Dexametasona 8 mg/2 ml amp. x 100', 'DXM8', 63]] },
  { n: 14, d: 'SALBUTAMOL AEROSOL 100 MCG', q: 150, e: 'pendiente', c: [['Salbutamol aerosol 100 mcg x 200 dosis', 'SLB100', 45]] },
];
const RESUELTO = ['automatico', 'confirmado', 'sin_match'];
const ETQ = { pendiente: 'Pendiente', sugerido: 'Sugerido', automatico: 'Automático', confirmado: 'Confirmado', sin_match: 'Sin match' };
let idx = R.findIndex((r) => !RESUELTO.includes(r.e));
const norm = (s) => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const tokens = (s) => norm(s).split(/[^a-z0-9,%]+/).filter((t) => t.length > 1);
// Highlights the words of the pliego the candidato shares (sky) and the numbers it does not (amber).
function resaltar(texto, pliego) {
  const tp = new Set(tokens(pliego));
  return texto.replace(/[A-Za-zÁÉÍÓÚáéíóúñÑ0-9,%]+/g, (w) => {
    const t = norm(w);
    if (t.length > 1 && tp.has(t)) return `<mark>${w}</mark>`;
    if (/\d/.test(t)) return `<mark class="miss">${w}</mark>`;
    return w;
  });
}
function motivo(c, r) {
  const tp = tokens(r.d), tc = new Set(tokens(c[0]));
  const comunes = tp.filter((t) => tc.has(t)).length;
  return `${comunes} de ${tp.length} palabras del pliego coinciden`;
}
function render() {
  document.getElementById('cells').innerHTML = R.map((r, i) =>
    `<button type="button" class="cell c-${r.e}" data-i="${i}" aria-current="${i === idx}" aria-label="Renglón ${r.n}, ${ETQ[r.e]}"></button>`).join('');
  const abiertos = R.filter((r) => !RESUELTO.includes(r.e)).length;
  document.getElementById('prog').textContent = `quedan ${abiertos} de ${R.length}`;
  const st = document.getElementById('stage');
  if (idx < 0) { st.innerHTML = '<div class="card done">Todos los renglones están resueltos. El proceso está listo para presupuestar.</div>'; return; }
  const r = R[idx];
  st.innerHTML = `<div class="stage">
    <section class="card pliego" aria-label="Renglón del pliego">
      <div class="lbl">Renglón ${r.n} · pliego del cliente</div>
      <h2>${r.d}</h2>
      <dl class="facts"><dt>Cantidad</dt><dd>${r.q.toLocaleString('es-AR')}</dd><dt>Estado</dt><dd>${ETQ[r.e]}</dd><dt>Cliente</dt><dd>Hospital Sayago</dd></dl>
      <div class="nav-r">
        <button type="button" class="btn btn-secondary" id="prev"><kbd>←</kbd> Anterior</button>
        <button type="button" class="btn btn-secondary" id="next">Saltear <kbd>→</kbd></button>
        <button type="button" class="btn btn-secondary" id="sin" style="margin-left:auto">Sin match <kbd>S</kbd></button>
      </div>
    </section>
    <section class="card" aria-label="Candidatos del catálogo">
      <div class="lbl">Candidatos del catálogo</div>
      ${r.c.length ? `<div class="cands">${r.c.map((c, i) => `<button type="button" class="cand ${r.p === i ? 'elegido' : r.p == null && i === 0 ? 'best' : ''}" data-c="${i}">
        <span><span class="name">${resaltar(c[0], r.d)}</span><br><span class="sub">${c[1]}</span></span>
        <span class="score">${c[2]}%<small><kbd>${i + 1}</kbd></small></span>
        <span class="why">${motivo(c, r)}</span></button>`).join('')}</div>`
        : '<p class="empty">El matching no encontró candidatos para este renglón.</p>'}
      <div class="other"><input type="text" placeholder="Otro producto: buscá por nombre o código" aria-label="Buscar otro producto en el catálogo"></div>
    </section></div>`;
}
function siguienteAbierto(desde) {
  for (let k = 1; k <= R.length; k++) { const j = (desde + k) % R.length; if (!RESUELTO.includes(R[j].e)) return j; }
  return -1;
}
function decidir(estado, p) { const r = R[idx]; r.e = estado; r.p = p; idx = siguienteAbierto(idx); render(); }
document.addEventListener('click', (ev) => {
  const cell = ev.target.closest('.cell'); if (cell) { idx = +cell.dataset.i; render(); return; }
  const c = ev.target.closest('.cand'); if (c) { decidir('confirmado', +c.dataset.c); return; }
  if (ev.target.closest('#sin')) decidir('sin_match', null);
  if (ev.target.closest('#next')) { idx = (idx + 1) % R.length; render(); }
  if (ev.target.closest('#prev')) { idx = (idx - 1 + R.length) % R.length; render(); }
});
document.addEventListener('keydown', (ev) => {
  if (ev.target.tagName === 'INPUT' || idx < 0) return;
  const r = R[idx];
  if (/^[1-5]$/.test(ev.key) && r.c[+ev.key - 1]) decidir('confirmado', +ev.key - 1);
  else if (ev.key === 'Enter' && r.c[0]) { decidir('confirmado', 0); ev.preventDefault(); }
  else if (ev.key === 's' || ev.key === 'S') decidir('sin_match', null);
  else if (ev.key === 'ArrowRight') { idx = (idx + 1) % R.length; render(); }
  else if (ev.key === 'ArrowLeft') { idx = (idx - 1 + R.length) % R.length; render(); }
});
render();
</script>
</body>
</html>
